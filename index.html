<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漢字単語帳 食品製造</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>熟語単語帳 <small>特定技能2号・飲食料品製造業</small></h1>
  <nav>
    <button id="tab-card" class="tab active">カード</button>
    <button id="tab-quiz" class="tab">クイズ</button>
  </nav>
  <div class="controls">
    <label>分類
      <select id="cat"></select>
    </label>
    <label class="chk"><input type="checkbox" id="unknown"> 未習得のみ</label>
    <button id="shuffle" class="sub">シャッフル</button>
    <button id="reset" class="sub">記録を消す</button>
  </div>
  <p id="progress"></p>
</header>
<main id="view"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
